services:
  postgres:
    image: postgres:16-alpine
    container_name: skorost-vkus-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: skorost
      POSTGRES_PASSWORD: skorost_secret
      POSTGRES_DB: skorost_vkus
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
