# Nginx для skorostivkus.ru
# Снаружи хостинг пробрасывает: 6080→80, 6443→443
# ВНУТРИ VPS nginx слушает 80 и 443 — НЕ 6080 и НЕ 6443

# --- Самоподписанный сертификат (один раз на сервере) ---
# mkdir -p /etc/nginx/ssl
# openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#   -keyout /etc/nginx/ssl/skorostivkus.key \
#   -out /etc/nginx/ssl/skorostivkus.crt \
#   -subj "/CN=skorostivkus.ru"

# HTTP → HTTPS (снаружи :6080 → :6443)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name skorostivkus.ru www.skorostivkus.ru _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:6443$request_uri;
    }
}

# HTTPS (снаружи :6443 → внутри :443)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name skorostivkus.ru www.skorostivkus.ru _;

    ssl_certificate     /etc/nginx/ssl/skorostivkus.crt;
    ssl_certificate_key /etc/nginx/ssl/skorostivkus.key;

    client_max_body_size 5M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- Let's Encrypt (после certbot DNS challenge) — замените пути ssl_certificate ---
# ssl_certificate /etc/letsencrypt/live/skorostivkus.ru/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/skorostivkus.ru/privkey.pem;
